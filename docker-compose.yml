services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama        # models persist across restarts
    environment:
      - OLLAMA_NUM_PARALLEL=1              # 1 = safe for CPU-only (Intel)
      - OLLAMA_MAX_LOADED_MODELS=1         # keep 1 model in memory at a time
      - OLLAMA_KEEP_ALIVE=10m              # unload model after 10 min idle (saves RAM)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional: pull a model automatically on first start
  # Remove this service after first run (model is cached in the volume)
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "
        echo 'Pulling llama3.1:8b (4.7GB — first run only)...' &&
        ollama pull llama3.1:8b &&
        echo 'Done. llama3.1:8b is ready.' ||
        echo 'Pull failed — run manually: docker exec ollama ollama pull llama3.1:8b'
      "
    restart: "no"                          # run once, then stop

volumes:
  ollama_models:                           # named volume — survives docker compose down
